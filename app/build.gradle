plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'org.jetbrains.kotlin.android'

}

android {

    defaultConfig {
        applicationId "com.demo.example"
        minSdk 26
        compileSdk 34
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    namespace 'com.demo.example'
    buildFeatures {
        viewBinding true
    }
    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {


    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.0'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    implementation 'androidx.lifecycle:lifecycle-process:2.9.0'
    implementation 'androidx.multidex:multidex:2.0.1'

    // Firebase BoM - choose latest stable version
    implementation platform('com.google.firebase:firebase-bom:33.13.0')

    // Add Firebase dependencies WITHOUT versions
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-config'
    implementation 'com.google.firebase:firebase-messaging'
    // add other Firebase SDKs here as needed
//    implementation("androidx.datastore:datastore-preferences-core:1.1.6")
//    implementation "androidx.datastore:datastore-preferences:1.1.6"
//    implementation "androidx.datastore:datastore-preferences:1.0.0"
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':AdsModule')
}